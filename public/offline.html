<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3ead9" />
    <title>Hors connexion · Event</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        background: #f3ead9;
        color: #241a1e;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background:
          radial-gradient(900px 640px at 8% -10%, rgba(199, 133, 47, 0.18), transparent 62%),
          radial-gradient(900px 640px at 100% 110%, rgba(63, 124, 107, 0.14), transparent 62%);
      }
      main {
        width: min(100%, 380px);
        padding: 28px;
        border: 1px solid rgba(36, 26, 30, 0.14);
        border-radius: 20px;
        background: #fbf5ea;
        box-shadow: 0 24px 48px -30px rgba(36, 26, 30, 0.4);
      }
      .mark {
        display: grid;
        width: 40px;
        height: 40px;
        place-items: center;
        border-radius: 12px;
        background: linear-gradient(135deg, #c7852f, #e6ab55);
        color: #1b1310;
        font: italic 800 22px/1 "Plus Jakarta Sans", system-ui, sans-serif;
      }
      h1 {
        margin: 24px 0 10px;
        color: #241a1e;
        font-size: 30px;
        font-weight: 850;
        font-style: italic;
        letter-spacing: -0.04em;
        line-height: 1.05;
      }
      p { margin: 0; color: #5c4a44; line-height: 1.6; }
      a {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        margin-top: 18px;
        padding: 0 20px;
        border-radius: 999px;
        background: linear-gradient(100deg, #c7852f, #e6ab55);
        color: #1b1310;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">e</span>
      <h1>Tu es hors connexion.</h1>
      <p>Reconnecte-toi pour retrouver les événements, tes billets et tes salons Event.</p>
      <a href="/">Réessayer</a>
    </main>
  </body>
</html>
