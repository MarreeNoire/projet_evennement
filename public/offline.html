<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080605" />
    <title>Hors connexion · Event</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        background: #080605;
        color: #fff5eb;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background:
          radial-gradient(900px 640px at 8% -10%, rgba(255, 74, 0, 0.22), transparent 62%),
          radial-gradient(900px 640px at 100% 110%, rgba(255, 138, 0, 0.16), transparent 62%);
      }
      main {
        width: min(100%, 380px);
        padding: 28px;
        border: 1px solid rgba(255, 242, 226, 0.12);
        border-radius: 20px;
        background: linear-gradient(160deg, #14100d, #0b0906);
        box-shadow: 0 24px 48px -28px rgba(0, 0, 0, 0.9);
      }
      .mark {
        display: grid;
        width: 40px;
        height: 40px;
        place-items: center;
        border-radius: 12px;
        background: linear-gradient(135deg, #ff4a00, #ff8a00);
        color: #1c0a02;
        font: italic 800 22px/1 "Plus Jakarta Sans", system-ui, sans-serif;
      }
      h1 {
        margin: 24px 0 10px;
        color: #fff5eb;
        font-size: 30px;
        font-weight: 850;
        font-style: italic;
        letter-spacing: -0.04em;
        line-height: 1.05;
      }
      p { margin: 0; color: rgba(255, 242, 226, 0.62); line-height: 1.6; }
      a {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        margin-top: 18px;
        padding: 0 20px;
        border-radius: 999px;
        background: linear-gradient(100deg, #ff4a00, #ff8a00);
        color: #1c0a02;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">e</span>
      <h1>Tu es hors connexion.</h1>
      <p>Reconnecte-toi pour retrouver les événements, tes billets et tes salons Event.</p>
      <a href="/">Réessayer</a>
    </main>
  </body>
</html>
