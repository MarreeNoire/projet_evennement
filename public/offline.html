<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f4ee" />
    <title>Hors connexion · Event</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f7f4ee; color: #202a35; }
      * { box-sizing: border-box; }
      body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 380px); padding: 28px; border: 1px solid #d7d1c5; background: #fffdfa; }
      .mark { display: grid; width: 40px; height: 40px; place-items: center; background: #202a35; color: #f7f4ee; font: italic 700 28px Georgia, serif; }
      h1 { margin: 28px 0 10px; font: 600 32px/1.08 Georgia, serif; }
      p { color: #5d6672; line-height: 1.6; }
      a { display: inline-flex; min-height: 48px; align-items: center; margin-top: 14px; padding: 0 18px; background: #b83f22; color: white; font-weight: 600; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">e</span>
      <h1>Tu es hors connexion.</h1>
      <p>Reconnecte-toi pour retrouver les événements, tes billets et tes salons Event.</p>
      <a href="/">Réessayer</a>
    </main>
  </body>
</html>
